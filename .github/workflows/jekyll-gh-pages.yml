name: Publish DEmuFM Next website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Restore full v0.4.1 website at repository root (one time)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f index.html ]; then
            test -f deployment/DEmuFM-Next-Public-0.0.6.tar.xz
            mkdir -p /tmp/demufm-site
            tar -xJf deployment/DEmuFM-Next-Public-0.0.6.tar.xz -C /tmp/demufm-site
            test -f /tmp/demufm-site/index.html
            test -f /tmp/demufm-site/assets/app.js
            cp /tmp/demufm-site/index.html .
            cp -a /tmp/demufm-site/assets .
            mkdir -p data
            for name in arcade.json demo.json game-details.json releases.json; do
              cp "/tmp/demufm-site/data/$name" "data/$name"
            done
            touch .nojekyll
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f index.html assets .nojekyll data/arcade.json data/demo.json data/game-details.json data/releases.json
            if ! git diff --cached --quiet; then
              git commit -m "Restore DEmuFM Next website at site root"
              git push origin HEAD:main
            fi
          fi
      - name: Assemble the public site from canonical root assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _publish
          mkdir -p _publish/data _publish/compatibility/arcade
          test -f index.html
          test -f assets/app.js
          test -f data/arcade.json
          cp index.html _publish/
          cp -a assets logo img _publish/
          cp data/arcade.json data/demo.json data/game-details.json data/releases.json _publish/data/
          if [ -f data/game-media.json ]; then
            cp data/game-media.json _publish/data/game-media.json
          fi
          cp -a compatibility/arcade/imgs _publish/compatibility/arcade/
          touch _publish/.nojekyll
          python3 - <<'PY'
          import json
          from pathlib import Path
          games = json.loads(Path('_publish/data/arcade.json').read_text(encoding='utf-8'))
          assert len(games) == 400
          assert len({g['rom'] for g in games}) == 400
          assert not any(g['rom'] in ('1942', '1942gl') for g in games)
          for resource in ('index.html', 'assets/app.js', 'assets/i18n.js', 'assets/styles.css'):
              assert Path('_publish', resource).exists(), resource
          print('Validated real DEmuFM Next website with 400 games.')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_publish
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
