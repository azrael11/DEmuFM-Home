name: Deploy DEmuFM Next static website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare DEmuFM Next site (no legacy HTML pages)
        shell: bash
        run: |
          set -euo pipefail
          test -f deployment/DEmuFM-Next-Public-0.0.6.tar.xz || { echo "::error::Missing validated production payload"; exit 1; }
          mkdir -p _publish
          tar -xJf deployment/DEmuFM-Next-Public-0.0.6.tar.xz -C _publish
          test -f _publish/index.html
          test -f _publish/assets/app.js
          test -f _publish/data/arcade.json
          python3 - <<'PY'
          import json
          with open('_publish/data/arcade.json', encoding='utf-8') as f:
              games=json.load(f)
          assert len(games)==400 and len(set(g['rom'] for g in games))==400
          assert not any(g['rom'] in ('1942','1942gr') for g in games)
          PY
          # Keep the owner's genuine assets while retiring all OLD HTML routes.
          cp -a logo _publish/
          cp -a img _publish/
          mkdir -p _publish/compatibility/arcade
          cp -a compatibility/arcade/imgs _publish/compatibility/arcade/
          # Website images can be added in parallel to arcade-nosamples.
          if [ -d assets/game-media ]; then
            mkdir -p _publish/assets/game-media
            cp -a assets/game-media/. _publish/assets/game-media/
          fi
          if [ -f data/game-media.json ]; then
            cp data/game-media.json _publish/data/game-media.json
          fi
          touch _publish/.nojekyll
          echo "Deploying DEmuFM Next. Legacy HTML pages are not part of _publish."
      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_publish
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
